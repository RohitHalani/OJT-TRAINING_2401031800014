<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Partners</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .partner-section{
            padding: 50px 0;
            background-color: #f8f9fa;
        }

        .partner-card{
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .partner-card img{
            width: 100%;
            height: 120px;
            object-fit: contain;
        }

        .partner-card h5{
            margin-top: 15px;
            font-weight: bold;
        }

        .partner-card p{
            color: gray;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Partner Section -->
    <section class="partner-section">
        <div class="container">

            <h2 class="text-center mb-5">Our Trusted Partners</h2>

            <div class="row">

                <!-- Partner 1 -->
                <div class="col-lg-3 col-md-6 col-12">
                    <div class="partner-card">
                        <img src="images/partner1.png" alt="">
                        <h5>Amazon</h5>
                        <p>Official Shopping Partner</p>
                    </div>
                </div>

                <!-- Partner 2 -->
                <div class="col-lg-3 col-md-6 col-12">
                    <div class="partner-card">
                        <img src="images/partner2.png" alt="">
                        <h5>Flipkart</h5>
                        <p>Delivery Partner</p>
                    </div>
                </div>

                <!-- Partner 3 -->
                <div class="col-lg-3 col-md-6 col-12">
                    <div class="partner-card">
                        <img src="images/partner3.png" alt="">
                        <h5>Meesho</h5>
                        <p>Reseller Partner</p>
                    </div>
                </div>

                <!-- Partner 4 -->
                <div class="col-lg-3 col-md-6 col-12">
                    <div class="partner-card">
                        <img src="images/partner4.png" alt="">
                        <h5>Shopify</h5>
                        <p>Ecommerce Platform</p>
                    </div>
                </div>

            </div>

        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Card UI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f2f2;
    }

    .payment-box{
      width:320px;
      background:#fff;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.15);
    }

    .title{
      padding:15px;
      font-size:24px;
      font-weight:bold;
      color:#444;
    }

    .card{
      margin:0 15px;
      padding:20px;
      border-radius:8px;
      background:linear-gradient(135deg,#7b4dff,#5a35d6);
      color:#fff;
      position:relative;
    }

    .visa{
      font-weight:bold;
      font-size:18px;
      margin-bottom:25px;
    }

    .dots{
      letter-spacing:3px;
      font-size:20px;
      margin-bottom:20px;
    }

    .card-bottom{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      font-size:12px;
    }

    .label{
      opacity:0.7;
      font-size:10px;
      margin-bottom:3px;
    }

    .name{
      font-size:15px;
      margin-top:5px;
    }

    .form{
      padding:20px 15px;
    }

    .input-group{
      margin-bottom:18px;
    }

    .input-group label{
      display:block;
      font-size:10px;
      color:#999;
      margin-bottom:5px;
      text-transform:uppercase;
    }

    .input-group input{
      width:100%;
      border:none;
      border-bottom:1px solid #ccc;
      padding:8px 0;
      outline:none;
      font-size:14px;
    }

    .row{
      display:flex;
      gap:15px;
    }

    .checkbox{
      display:flex;
      align-items:center;
      font-size:12px;
      color:#777;
      margin-bottom:20px;
    }

    .checkbox input{
      margin-right:8px;
      accent-color:#6c3df4;
    }

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .total{
      font-size:14px;
      font-weight:bold;
      color:#444;
    }

    .btn{
      background:#6c3df4;
      color:#fff;
      border:none;
      padding:12px 20px;
      border-radius:20px;
      cursor:pointer;
      font-size:12px;
      font-weight:bold;
    }

    .btn:hover{
      background:#5b2fe0;
    }
  </style>
</head>
<body>

  <div class="payment-box">

    <div class="title">PAYMENT</div>

    <div class="card">
      <div class="visa">VISA</div>

      <div class="dots">•••• •••• •••• 8014</div>

      <div class="card-bottom">
        <div>
          <div class="label">CARD HOLDER</div>
          <div class="name">KELLY OLIVER</div>
        </div>

        <div>
          <div class="label">EXPIRES</div>
          <div class="name">08/21</div>
        </div>
      </div>
    </div>

    <div class="form">

      <div class="input-group">
        <label>Credit Card Number</label>
        <input type="text" value="XXXX XXXX XXXX 8014">
      </div>

      <div class="input-group">
        <label>Card Holder Name</label>
        <input type="text" value="KELLY OLIVER">
      </div>

      <div class="row">
        <div class="input-group">
          <label>Expiry</label>
          <input type="text" value="08/21">
        </div>

        <div class="input-group">
          <label>CVV</label>
          <input type="password" value="123">
        </div>
      </div>

      <div class="checkbox">
        <input type="checkbox" checked>
        Save this card for future transactions
      </div>

      <div class="footer">
        <div class="total">TOTAL: ₹999</div>

        <button class="btn" onclick="f1()">PROCEED TO PAY</button>
      </div>

    </div>

  </div>

</body>
<script>
  function f1(){
    alert("done!    ");
       window.location.href = "index.html";
  }
</script>
</html>
